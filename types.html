<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>16の友達タイプ — Mingle 友達タイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EE; --cream-2:#F4ECDF; --surface:#FFFFFF;
  --ink:#2B2521; --ink-soft:#6F645B; --ink-faint:#A89C90;
  --coral:#F0714A; --teal:#2BAE96; --honey:#F2A93B; --line:#EEE4D4;
  --shadow:0 14px 36px -22px rgba(70,45,25,.5); --shadow-sm:0 8px 22px -16px rgba(70,45,25,.5);
  --maru:"Zen Maru Gothic",sans-serif; --kaku:"Zen Kaku Gothic New",sans-serif; --mono:"Outfit",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream); color:var(--ink); font-family:var(--kaku); -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--maru)}
.mono{font-family:var(--mono); letter-spacing:.04em}

.topnav{position:sticky; top:0; z-index:20; background:rgba(251,246,238,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.topnav-in{max-width:1120px; margin:0 auto; padding:13px 18px; display:flex; align-items:center; gap:12px}
.back{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--ink-soft); font-weight:700; font-size:13.5px; padding:8px 14px; border-radius:999px; transition:.15s}
.back:hover{background:var(--cream-2); color:var(--ink)}
.topnav .brand{display:flex; align-items:center; gap:8px; margin:0 auto}
.topnav .brand span{font-family:var(--maru); font-weight:900; font-size:16px}
.topnav .start{text-decoration:none; background:var(--coral); color:#fff; font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; box-shadow:var(--shadow-sm)}

header{text-align:center; padding:40px 20px 6px; max-width:680px; margin:0 auto}
header .eyebrow{font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.16em; color:var(--coral); text-transform:uppercase}
header h1{font-size:clamp(26px,6vw,38px); font-weight:900; line-height:1.25; margin-top:10px; word-break:auto-phrase}
header p{color:var(--ink-soft); font-size:14.5px; margin-top:12px; line-height:1.7}
.axes{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:18px}
.axes .ax{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12px; font-weight:700; color:var(--ink-soft); box-shadow:var(--shadow-sm)}
.axes .ax b{color:var(--ink); font-family:var(--mono)}

.grid{max-width:1120px; margin:0 auto; padding:30px 16px 70px; display:grid; gap:16px; grid-template-columns:1fr 1fr}
@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr); gap:18px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative; border-radius:22px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,.04); transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s; display:flex; flex-direction:column; isolation:isolate}
.tile:hover{transform:translateY(-6px); box-shadow:var(--shadow)}
.tile .art{position:relative; aspect-ratio:1/1; overflow:hidden; display:flex; align-items:flex-end; justify-content:center}
.tile .art::before{content:""; position:absolute; inset:0; z-index:0; background:var(--g)}
.tile .art::after{content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(120% 80% at 50% 18%, rgba(255,255,255,.34), transparent 60%)}
.tile .art img{position:relative; z-index:2; width:100%; height:100%; object-fit:cover; object-position:50% 12%; filter:drop-shadow(0 8px 14px rgba(40,25,12,.22))}
.tile .code{position:absolute; z-index:3; top:11px; left:12px; font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.12em; color:#fff; background:rgba(0,0,0,.22); padding:4px 9px; border-radius:999px; backdrop-filter:blur(3px)}
.tile .num{position:absolute; z-index:3; top:11px; right:12px; font-family:var(--mono); font-weight:700; font-size:11px; color:rgba(255,255,255,.92)}
.tile .body{background:var(--surface); padding:14px 15px 16px; flex:1; display:flex; flex-direction:column; gap:5px}
.tile .body h3{font-size:16.5px; font-weight:700; line-height:1.3}
.tile .body .copy{font-size:11.5px; color:var(--ink-soft); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

.modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(43,37,33,.5); backdrop-filter:blur(4px)}
.modal.open{display:flex}
.sheet{background:var(--surface); border-radius:26px; max-width:420px; width:100%; max-height:92vh; overflow:auto; box-shadow:var(--shadow); position:relative}
.sheet .top{aspect-ratio:1/1; position:relative; display:flex; align-items:flex-end; justify-content:center; overflow:hidden}
.sheet .top::before{content:""; position:absolute; inset:0; background:var(--g)}
.sheet .top::after{content:""; position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 16%, rgba(255,255,255,.36), transparent 62%)}
.sheet .top img{position:relative; z-index:2; width:90%; height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 10px 18px rgba(40,25,12,.26))}
.sheet .top .code{position:absolute; z-index:3; top:14px; left:16px; font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.14em; color:#fff; background:rgba(0,0,0,.24); padding:5px 12px; border-radius:999px}
.sheet .info{padding:22px 22px 26px}
.sheet .info .id{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink-faint)}
.sheet .info h2{font-size:25px; font-weight:900; margin:3px 0 8px}
.sheet .info .copy{font-size:14.5px; color:var(--ink-soft); line-height:1.7}
.sheet .info .swrow{display:flex; align-items:center; gap:9px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line)}
.sheet .info .sw{width:18px;height:18px;border-radius:6px}
.sheet .info .hex{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink-soft)}
.sheet .close{position:absolute; z-index:4; top:13px; right:14px; width:34px;height:34px;border-radius:999px; background:rgba(255,255,255,.9); border:none; cursor:pointer; font-size:18px; color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm)}
footer{text-align:center; padding:0 20px 60px}
footer a{display:inline-block; text-decoration:none; background:var(--coral); color:#fff; font-weight:700; font-size:15px; padding:15px 30px; border-radius:15px; box-shadow:var(--shadow-sm)}
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-in">
    <a class="back" href="index.html">← 診断トップ</a>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none"><path d="M20 5 L33.6 28.5 H6.4 Z" stroke="#F0714A" stroke-width="3.6" stroke-linejoin="round"/><circle cx="20" cy="5" r="4" fill="#F0714A"/><circle cx="33.6" cy="28.5" r="4" fill="#2BAE96"/><circle cx="6.4" cy="28.5" r="4" fill="#F2A93B"/></svg>
      <span>Mingle</span>
    </div>
    <a class="start" href="index.html">診断する</a>
  </div>
</div>

<header>
  <div class="eyebrow">16 Friend Types</div>
  <h1>16の友達タイプ</h1>
  <p>あなたに似ているのは、どのキャラ？<br>タップで詳しく見られます。</p>
  <div class="axes">
    <div class="ax"><b>E/I</b> 能動・受動</div>
    <div class="ax"><b>A/S</b> 広く・深く</div>
    <div class="ax"><b>F/L</b> 感情・行動</div>
    <div class="ax"><b>C/V</b> 定着・流動</div>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer><a href="index.html">自分のタイプを診断する →</a></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script src="analytics.js"></script>
<script src="types-data.js"></script>
<script>
const T = Object.values(window.MINGLE_TYPES);
function lighten(hex,amt){const x=parseInt(hex.slice(1),16);let r=(x>>16)&255,g=(x>>8)&255,b=x&255;r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);return`rgb(${r},${g},${b})`;}
function grad(c){return `linear-gradient(165deg, ${lighten(c,.22)}, ${c} 78%)`;}

document.getElementById('grid').innerHTML = T.map((t,i)=>`
  <div class="tile" data-i="${i}" style="--g:${grad(t.color)}">
    <div class="art">
      <span class="code">${t.code}</span><span class="num">${String(i+1).padStart(2,'0')}</span>
      <img src="assets/characters/char_${t.id}.png" alt="${t.name}" loading="lazy">
    </div>
    <div class="body"><h3>${t.name}</h3><div class="copy">${t.copy}</div></div>
  </div>`).join('');

const modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
function open(i){
  const t=T[i]; sheet.style.setProperty('--g',grad(t.color));
  sheet.innerHTML=`<button class="close" aria-label="閉じる">✕</button>
    <div class="top"><span class="code">${t.code}</span><img src="assets/characters/char_${t.id}.png" alt="${t.name}"></div>
    <div class="info"><div class="id">${t.id}</div><h2>${t.name}</h2><div class="copy">${t.copy}</div>
      <div class="swrow"><span class="sw" style="background:${t.color}"></span><span class="hex mono">${t.color}</span></div></div>`;
  modal.classList.add('open'); sheet.querySelector('.close').onclick=close;
}
function close(){modal.classList.remove('open')}
document.getElementById('grid').addEventListener('click',e=>{const tl=e.target.closest('.tile'); if(tl) open(+tl.dataset.i)});
modal.addEventListener('click',e=>{if(e.target===modal) close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape') close()});
</script>
</body>
</html>
